<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rannaghor — The Bangladeshi Kitchen</title>
<meta name="description" content="Over 120 dishes of Bangladesh with pictures, simple recipes, a cook mode, Bangla and English, and regional themes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --hero:#0D3B2C;--accent:#EBA81C;--disc:#C8202E;
  --bg:color-mix(in srgb,var(--hero) 7%,#fff);--surface:color-mix(in srgb,var(--hero) 2%,#fff);
  --text:#10231A;--muted:#475D52;--line:rgba(16,35,26,.2);
  --chip:color-mix(in srgb,var(--hero) 12%,#fff);--chip-on:var(--hero);--chip-on-text:#fff;
  --hot:#C8202E;--focus:#C8202E;
  --c-rice:#7A6A1E;--c-fish:#1F6C8F;--c-meat:#B3202C;--c-veg:#2E7D3E;--c-dal:#9A6B00;--c-snack:#B9531A;--c-bread:#8B6137;--c-pitha:#7A4A33;--c-sweet:#B03E7A;--c-drink:#1D7A70;--c-fruit:#4F7A12;
  --display:"Tiro Bangla","Noto Serif Bengali","Kalpurush",Georgia,serif;
  --sans:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[data-region="dhaka"]{--hero:#431A4C;--accent:#FFD23F;--disc:#E4256B}
[data-region="chattogram"]{--hero:#0B3C5D;--accent:#F2C14E;--disc:#1D8FA8}
[data-region="sylhet"]{--hero:#1B4D2E;--accent:#CFE8A5;--disc:#5E9E34}
[data-region="khulna"]{--hero:#2E3B1D;--accent:#F5A623;--disc:#D98E04}
[data-region="barishal"]{--hero:#123A4A;--accent:#9EE0E6;--disc:#3FA7D6}
[data-region="rajshahi"]{--hero:#7A3E00;--accent:#FFD166;--disc:#E59A00}
[data-region="rangpur"]{--hero:#5C1A24;--accent:#FFB3A7;--disc:#D7263D}
[data-region="mymensingh"]{--hero:#1F2A5C;--accent:#E6E9FF;--disc:#5B6EE1}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:color-mix(in srgb,var(--hero) 45%,#000);--surface:color-mix(in srgb,var(--hero) 70%,#000);--text:#E8F0E9;--muted:#B0C2B7;--line:rgba(232,240,233,.26);--chip:color-mix(in srgb,var(--hero) 75%,#fff);--chip-on:var(--accent);--chip-on-text:#111;--hot:#F0505F;--focus:var(--accent);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:color-mix(in srgb,var(--hero) 45%,#000);--surface:color-mix(in srgb,var(--hero) 70%,#000);--text:#E8F0E9;--muted:#B0C2B7;--line:rgba(232,240,233,.26);--chip:color-mix(in srgb,var(--hero) 75%,#fff);--chip-on:var(--accent);--chip-on-text:#111;--hot:#F0505F;--focus:var(--accent);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px);scroll-behavior:smooth}
html.lock{overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.65}
body,.hero,.band,footer,.chip,.tag,.search,.filters,.ib,dialog{transition:background-color .7s ease,color .7s ease,border-color .7s ease}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}ul,ol{padding:0;list-style:none}a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.hero :focus-visible,.band :focus-visible{outline-color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:#000;padding:8px 14px;border-radius:8px;z-index:100}.skip:focus{top:12px}

/* hero */
.hero{background:var(--hero);color:#fff;overflow:hidden}
.hero nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-top:20px;padding-bottom:6px}
.brand{font-family:var(--display);font-size:1.5rem;text-decoration:none;color:#fff;line-height:1.3}
.brand small{font-family:var(--sans);font-size:.95rem;color:rgba(255,255,255,.75);margin-left:8px}
.links{display:flex;flex-wrap:wrap;gap:4px 20px}
.links a{color:rgba(255,255,255,.8);text-decoration:none;font-weight:500}.links a:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
.ctl{display:flex;gap:8px;align-items:center}
.ib{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;min-width:42px;height:42px;padding:0 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{background:rgba(255,255,255,.2)}
.ib[aria-pressed="false"]{opacity:.6}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:24px;padding-top:30px;padding-bottom:64px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.9rem,8vw,6rem);line-height:1.25;animation:rise .9s .05s both}
.proverb{margin-top:6px;font-size:1.25rem;font-weight:500;color:var(--accent);animation:rise .9s .25s both}
.lede{margin-top:18px;max-width:48ch;color:rgba(255,255,255,.85);font-size:1.08rem;animation:rise .9s .4s both}
.cta{display:inline-block;margin-top:26px;background:var(--accent);color:#14201A;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:999px;transition:transform .3s,filter .3s;animation:rise .9s .55s both}
.cta:hover{transform:translateY(-2px);filter:brightness(1.08)}
.themes{margin-top:26px;animation:rise .9s .7s both}
.themes>span{display:block;font-weight:600;font-size:.95rem;color:rgba(255,255,255,.8);margin-bottom:8px}
.theme-row{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 14px 4px 6px;cursor:pointer;font-size:.92rem;font-weight:500;transition:transform .25s,background .3s}
.tchip:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.tchip[aria-pressed="true"]{background:#fff;color:#14201A;border-color:#fff}
.tchip i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.7)}
.sun{justify-self:center;width:min(100%,440px);transition:opacity .35s ease,transform .5s ease}
.sun.swap{opacity:0;transform:scale(.92) rotate(-8deg)}
.sun svg{display:block;width:100%;height:auto;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.sun .spin{transform-origin:200px 200px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr;padding-bottom:48px}.sun{order:-1;width:min(66vw,260px);justify-self:start}}

section{padding:72px 0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1.3}
.sub{margin-top:8px;color:var(--muted);max-width:62ch}

/* reveal */
.js .reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .reveal.in{opacity:1;transform:none}

/* menu */
.menu{padding-bottom:40px}
.filters{background:var(--bg);padding:16px 0 12px;margin-top:20px;border-bottom:1px solid var(--line);z-index:5}
@media (min-width:760px){.filters{position:sticky;top:env(safe-area-inset-top,0px)}}
.search{width:100%;font:inherit;font-size:1.05rem;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;font-weight:500;font-size:.95rem;border:0;cursor:pointer;background:var(--chip);color:var(--text);padding:7px 15px;border-radius:999px;white-space:nowrap;transition:transform .2s}
.chip:hover{transform:translateY(-1px)}
.chip small{opacity:.75;margin-left:4px;font-size:.85em}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-text)}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:8px;font-size:.95rem}
.opts label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--c-veg)}
.opts select{font:inherit;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:3px 8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 14px;cursor:pointer;font-weight:600}
.pill:hover{border-color:var(--text)}
.status{margin-left:auto;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-left:10px}
.group{margin-top:52px;padding:0}
.group h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;padding-bottom:8px;border-bottom:4px solid var(--c)}
.group h3 .pri{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.35}
.group h3 .sec{font-weight:600;font-size:1.05rem;color:var(--muted)}
.group h3 .n{margin-left:auto;font-size:.95rem;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));column-gap:48px}
.dish{position:relative;display:grid;grid-template-columns:112px 1fr;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line)}
.pic{width:112px;height:112px;border-radius:24px;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,var(--surface));transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.pic svg{display:block;width:100%;height:100%}
.dish:hover .pic{transform:scale(1.06) rotate(-2deg);box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
.dish h4{font-weight:400;padding-right:34px}
.nm{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block}
.nm::after{content:"";position:absolute;inset:0}
.nm:focus-visible{outline:none}.dish:has(.nm:focus-visible){outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
.pri{display:block}
.dish .pri{font-family:var(--display);font-size:1.35rem;line-height:1.4}
.dish .sec{display:block;font-weight:600;font-size:.96rem;color:var(--muted)}
.dish p.d{margin-top:6px;max-width:58ch;font-size:.97rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.spice{display:inline-flex;gap:5px;align-items:center}
.chili{display:inline-block;width:14px;height:5px;border-radius:5px;background:var(--line);transform:rotate(-30deg)}.chili.on{background:var(--hot)}
.tag{background:var(--chip);color:var(--text);padding:1px 10px;border-radius:999px}
.fav{position:absolute;top:14px;right:0;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);transition:transform .25s,color .25s}
.fav:hover{transform:scale(1.2)}.fav[aria-pressed="true"]{color:var(--hot)}
.fav.pop{animation:heart .5s ease}
@keyframes heart{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.empty{margin-top:56px;padding:28px 0;max-width:52ch}.empty h3{font-family:var(--display);font-weight:400;font-size:1.8rem}.empty .linkbtn{margin:10px 0 0}

/* bands */
.band{background:var(--hero);color:#EAF1EC}.band h2{color:#fff}.band .sub{color:rgba(255,255,255,.78)}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:40px 36px;margin-top:44px}
.tables h3{font-weight:400}.tables .pri{font-family:var(--display);font-size:1.9rem;color:var(--accent);line-height:1.4}.tables .sec{display:block;font-weight:600}
.tables p{margin-top:8px;color:rgba(255,255,255,.78);font-size:.97rem}
.tables ul{margin-top:14px;border-top:2px solid rgba(255,255,255,.3)}.tables li{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.28)}

.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:44px 36px;margin-top:44px}
.region{border-top:4px solid var(--text);padding-top:16px}.region:nth-child(3n+2){border-top-color:var(--hot)}.region:nth-child(3n){border-top-color:var(--accent)}
.region .rs{width:104px;height:104px;margin-bottom:10px}.region .rs svg{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.region:hover .rs svg{transform:rotate(8deg) scale(1.06)}
.region h3{font-weight:400}.region .pri{font-family:var(--display);font-size:1.9rem;line-height:1.4}.region .sec{display:block;font-weight:700}
.region p{margin-top:6px;color:var(--muted);font-size:.97rem}
.region ul{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.region ul .chip{font-size:.9rem}.region ul .chip:hover{background:var(--chip-on);color:var(--chip-on-text)}
.apply{margin-top:14px;border:2px solid var(--text);background:transparent;border-radius:999px;padding:5px 16px;cursor:pointer;font-weight:700;transition:background .3s,color .3s}
.apply:hover,.apply[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.seasons{padding-top:24px}.cal{margin-top:36px}
.cal div{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:6px 32px;padding:18px 0;border-top:1px dashed var(--line)}.cal div:last-child{border-bottom:1px dashed var(--line)}
.cal dt{font-weight:700}.cal dt span{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.45}.cal dt small{display:block;font-weight:500;color:var(--muted);font-size:.9rem}.cal dd{max-width:62ch}
@media (max-width:620px){.cal div{grid-template-columns:1fr}}
footer{background:color-mix(in srgb,var(--hero) 60%,#000);color:rgba(255,255,255,.8);padding:44px 0 56px;font-size:.95rem}
footer .brand{font-size:1.3rem}footer p{margin-top:10px;max-width:64ch}

/* dialogs */
dialog{border:0;padding:0;border-radius:28px;background:var(--bg);color:var(--text);width:min(960px,94vw);max-height:92vh;overflow:auto;box-shadow:0 40px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,12,9,.62);backdrop-filter:blur(5px);animation:fade .3s ease}
dialog[open]{animation:pop .42s cubic-bezier(.2,.9,.25,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dx{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:1.3rem;line-height:1}
.r-head{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:28px;padding:28px clamp(18px,4vw,36px) 8px;align-items:center}
.r-art{aspect-ratio:1;border-radius:32px;overflow:hidden;background:color-mix(in srgb,var(--c) 24%,var(--surface));animation:float 6s ease-in-out infinite}.r-art svg{width:100%;height:100%;display:block}
.r-cat{font-weight:600;color:var(--c);font-size:.95rem}
.r-head h2{font-size:clamp(2rem,5vw,3rem)}.r-en{font-weight:600;color:var(--muted);font-size:1.1rem}
.r-desc{margin-top:10px;max-width:54ch}
.r-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.r-meta li{background:var(--chip);padding:3px 14px;border-radius:999px;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.r-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:2px solid var(--text);background:transparent;border-radius:999px;padding:8px 20px;cursor:pointer;font-weight:700;transition:transform .25s,background .3s,color .3s}
.btn:hover{transform:translateY(-2px)}
.btn.pri2{background:var(--hero);border-color:var(--hero);color:#fff}
:root[data-theme="dark"] .btn.pri2,:root:not([data-theme="light"]) .btn.pri2{background:var(--accent);border-color:var(--accent);color:#111}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri2{background:var(--hero);border-color:var(--hero);color:#fff}}
.r-body{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px 40px;padding:18px clamp(18px,4vw,36px) 32px}
.r-body h3{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.4;margin-bottom:8px}
.ing li{padding:7px 0;border-bottom:1px dashed var(--line)}.ing label{display:flex;gap:10px;align-items:center;cursor:pointer}.ing input{width:18px;height:18px;accent-color:var(--c-veg)}
.ing input:checked+span{text-decoration:line-through;opacity:.55}
.steps{counter-reset:s}.steps li{counter-increment:s;position:relative;padding:10px 0 10px 50px;border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.note{grid-column:1/-1;font-size:.88rem;color:var(--muted)}
@media (max-width:760px){.r-head,.r-body{grid-template-columns:1fr}.r-art{max-width:260px}}

.cook{padding:28px clamp(18px,4vw,40px) 36px;min-height:60vh;display:flex;flex-direction:column;gap:18px;justify-content:center}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cook .sn{font-weight:700;color:var(--muted)}
.cook .st{font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.5;max-width:30ch;animation:slide .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.cook .cr{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.steam{display:flex;gap:14px;height:46px;align-items:flex-end}.steam span{width:9px;height:36px;border-radius:12px;background:linear-gradient(to top,var(--c),transparent);animation:steam 2.4s ease-in infinite;opacity:0}
.steam span:nth-child(2){animation-delay:.6s}.steam span:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(14px) scaleY(.6);opacity:0}30%{opacity:.7}100%{transform:translateY(-22px) scaleY(1.2);opacity:0}}
.done{text-align:center;padding:30px 0}.done .big{font-family:var(--display);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.3;animation:heart .9s ease}
.done .r-art{margin:18px auto;max-width:220px}
.lst{padding:28px clamp(18px,4vw,36px) 32px}.lst h2{font-size:2.2rem}.lst h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:22px 0 6px}
.lst li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.lst li small{color:var(--muted)}
.lst .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#111;color:#fff;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;z-index:200;transition:opacity .35s,transform .35s;font-weight:600}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .js .reveal{opacity:1;transform:none}
}

</style>
</head>
<body>
<script>document.documentElement.className="js";</script>
<a class="skip" href="#menu" data-i18n="skip">Skip to menu</a>
<header class="hero" id="top">
  <nav class="wrap" aria-label="Main">
    <a class="brand" href="#top"><span lang="bn">রান্নাঘর</span><small data-i18n="brand_small">Rannaghor</small></a>
    <ul class="links">
      <li><a href="#menu" data-i18n="nav_menu">Menu</a></li>
      <li><a href="#tables" data-i18n="nav_tables">Four tables</a></li>
      <li><a href="#divisions" data-i18n="nav_divisions">Eight divisions</a></li>
      <li><a href="#seasons" data-i18n="nav_seasons">Through the year</a></li>
    </ul>

/* Cooking methods. {m} is replaced by the dish's main ingredient. */
var M={
rice:{en:["Rinse the {m} in several changes of water until the water runs nearly clear.","Bring 2 cups of water per cup of rice to a boil with a pinch of salt.","Add the rice, stir once, cover, and cook on low heat for 12 to 15 minutes.","Switch off the heat and rest for 5 minutes with the lid on.","Fluff with a fork and serve hot."],
bn:["{m} কয়েকবার পানিতে ধুয়ে নিন, যতক্ষণ না পানি প্রায় পরিষ্কার হয়।","প্রতি কাপ চালে দুই কাপ পানি ও এক চিমটি লবণ দিয়ে ফুটিয়ে নিন।","চাল দিয়ে একবার নেড়ে ঢাকনা দিন এবং ১২ থেকে ১৫ মিনিট কম আঁচে রান্না করুন।","চুলা বন্ধ করে ঢাকনা দেওয়া অবস্থায় ৫ মিনিট রেখে দিন।","কাঁটা চামচ দিয়ে হালকা নেড়ে গরম গরম পরিবেশন করুন।"]},
panta:{en:["Cook rice as usual and let it cool completely.","Put the cold rice in a bowl and cover it with clean water. Add a pinch of salt.","Leave it covered overnight, or for at least 8 hours, at room temperature.","Serve with salt, sliced onion, green chilli and a drizzle of mustard oil.","Eat with fried hilsa, mashed potato or dried fish on the side."],
bn:["ভাত সাধারণভাবে রান্না করে পুরোপুরি ঠান্ডা করুন।","ঠান্ডা ভাত বাটিতে নিয়ে পরিষ্কার পানিতে ডুবিয়ে এক চিমটি লবণ দিন।","ঢেকে রেখে সারা রাত বা অন্তত ৮ ঘণ্টা ঘরের তাপমাত্রায় রাখুন।","লবণ, কুচি পেঁয়াজ, কাঁচা মরিচ ও সামান্য সরিষার তেল দিয়ে পরিবেশন করুন।","পাশে ইলিশ ভাজা, আলু ভর্তা বা শুঁটকি ভর্তা নিয়ে খান।"]},
polao:{en:["Wash the {m} and soak it in water for 30 minutes, then drain well.","Heat ghee in a pot and fry sliced onion until golden. Add the whole spices and let them crackle.","Add the drained rice and stir gently for 2 minutes so each grain is coated in ghee.","Pour in hot water (a little less than 1.5 times the rice), add salt, and bring to a boil.","Cover tightly, cook on the lowest heat for 15 minutes, then rest 10 minutes before fluffing."],
bn:["{m} ধুয়ে ৩০ মিনিট ভিজিয়ে রাখুন, তারপর ভালো করে পানি ঝরিয়ে নিন।","হাঁড়িতে ঘি গরম করে কুচি পেঁয়াজ সোনালি করে ভাজুন। গোটা গরম মসলা দিয়ে ফোটাতে দিন।","পানি ঝরানো চাল দিয়ে দুই মিনিট আলতো করে নাড়ুন, যেন প্রতিটি দানা ঘি মেখে নেয়।","গরম পানি (চালের দেড়গুণের একটু কম) ও লবণ দিয়ে ফুটিয়ে নিন।","শক্ত করে ঢাকনা দিয়ে একদম কম আঁচে ১৫ মিনিট রান্না করুন, তারপর ১০ মিনিট রেখে নেড়ে নিন।"]},
biryani:{en:["Marinate the {m} with yoghurt, ginger-garlic paste, chilli, spices, salt and fried onion for at least 2 hours.","Par-boil the rice with whole spices and salt until it is 70 percent cooked, then drain.","In a heavy pot, layer the marinated meat (and potato), then the rice, then a spoon of ghee and fried onion.","Seal the lid with dough or foil and cook on the lowest heat for 45 to 60 minutes.","Rest for 10 minutes, then open and gently mix from the bottom up before serving."],
bn:["{m} দই, আদা-রসুন বাটা, মরিচ, মসলা, লবণ ও বেরেস্তা দিয়ে কমপক্ষে ২ ঘণ্টা মেখে রাখুন।","চাল গোটা মসলা ও লবণসহ ৭০ শতাংশ সেদ্ধ করে পানি ঝরিয়ে নিন।","ভারী হাঁড়িতে মাখানো মাংস (ও আলু), তার ওপর ভাত, তারপর ঘি ও বেরেস্তা দিয়ে স্তরে স্তরে সাজান।","ময়দার খামির বা ফয়েল দিয়ে ঢাকনা সিল করে সবচেয়ে কম আঁচে ৪৫ থেকে ৬০ মিনিট দমে রাখুন।","১০ মিনিট রেখে ঢাকনা খুলে নিচ থেকে ওপরে আলতো করে মিশিয়ে পরিবেশন করুন।"]},
onepot:{en:["Heat oil (mustard oil for tehari) and fry sliced onion until golden brown.","Add ginger-garlic paste, chilli, turmeric, cumin and the {m}. Fry until the oil separates.","Add the soaked rice and fry for 2 minutes.","Pour in hot water, add salt, and bring to a boil. Cover and cook on low heat for 20 minutes.","Rest for 10 minutes, then fluff and serve with a lime wedge and green chilli."],
bn:["তেল (তেহারিতে সরিষার তেল) গরম করে কুচি পেঁয়াজ বাদামি করে ভাজুন।","আদা-রসুন বাটা, মরিচ, হলুদ, জিরা ও {m} দিয়ে তেল ছেড়ে আসা পর্যন্ত কষান।","ভেজানো চাল দিয়ে দুই মিনিট ভাজুন।","গরম পানি ও লবণ দিয়ে ফুটতে দিন। ঢেকে কম আঁচে ২০ মিনিট রান্না করুন।","১০ মিনিট রেখে নেড়ে লেবুর টুকরা ও কাঁচা মরিচ দিয়ে পরিবেশন করুন।"]},
khichuri:{en:["Dry-roast the lentils in a pan until they smell nutty, then wash them together with the {m}.","Heat ghee and fry sliced onion, then add ginger, turmeric and green chilli.","Add the rice and lentils and stir for a minute.","Add water (about 4 times the volume) and salt, and cook on medium heat, stirring now and then, until soft and porridge-like.","Finish with a spoon of ghee and serve with fried egg, fish or beef."],
bn:["ডাল শুকনো কড়াইয়ে হালকা ভেজে নিন, তারপর {m} ও ডাল একসঙ্গে ধুয়ে নিন।","ঘি গরম করে কুচি পেঁয়াজ ভাজুন, তারপর আদা, হলুদ ও কাঁচা মরিচ দিন।","চাল ও ডাল দিয়ে এক মিনিট নাড়ুন।","চার গুণ পরিমাণ পানি ও লবণ দিয়ে মাঝারি আঁচে মাঝে মাঝে নেড়ে নরম ও ঘন হওয়া পর্যন্ত রান্না করুন।","ওপরে এক চামচ ঘি দিয়ে ডিম ভাজা, মাছ বা গরুর মাংসের সঙ্গে পরিবেশন করুন।"]},
jhol:{en:["Cut the {m} into pieces, rub with turmeric and salt, and shallow-fry until lightly golden. Set aside.","In the same oil fry sliced onion, then add ginger-garlic paste, turmeric, cumin, chilli and a splash of water. Cook until the oil shows.","Add potato or seasonal vegetables and 2 cups of hot water. Simmer for 8 minutes.","Slide in the fried fish, add slit green chillies, and cook gently for 5 minutes without stirring hard.","Sprinkle coriander leaves and serve with hot rice."],
bn:["{m} টুকরা করে হলুদ-লবণ মেখে হালকা সোনালি করে ভেজে তুলে রাখুন।","একই তেলে কুচি পেঁয়াজ ভাজুন, তারপর আদা-রসুন বাটা, হলুদ, জিরা, মরিচ ও একটু পানি দিয়ে তেল ভেসে ওঠা পর্যন্ত কষান।","আলু বা মৌসুমি সবজি ও দুই কাপ গরম পানি দিয়ে ৮ মিনিট ফুটতে দিন।","ভাজা মাছ ও চেরা কাঁচা মরিচ দিয়ে আলতো করে ৫ মিনিট রান্না করুন, জোরে নাড়বেন না।","ধনেপাতা ছিটিয়ে গরম ভাতের সঙ্গে পরিবেশন করুন।"]},
mustardfish:{en:["Soak mustard seeds in warm water for 15 minutes, then grind with green chilli, salt and a little water into a smooth paste. Do not over-grind, or it turns bitter.","Mix the paste with mustard oil, turmeric and, if you like, a little yoghurt or coconut.","Coat the {m} pieces well and let them rest for 15 minutes.","Steam in a covered dish (or wrapped in banana leaf), or cook covered on the lowest heat, for 12 to 15 minutes.","Finish with a drizzle of raw mustard oil and a slit green chilli. Serve with hot rice."],
bn:["সরিষা হালকা গরম পানিতে ১৫ মিনিট ভিজিয়ে কাঁচা মরিচ, লবণ ও সামান্য পানিসহ মসৃণ করে বাটুন। বেশি বাটলে তেতো হয়ে যায়।","বাটার সঙ্গে সরিষার তেল, হলুদ এবং চাইলে একটু দই বা নারকেল মেশান।","{m} টুকরাগুলোতে ভালো করে মাখিয়ে ১৫ মিনিট রেখে দিন।","ঢাকনা দেওয়া পাত্রে (বা কলা পাতায় মুড়ে) ভাপে, অথবা ঢেকে সবচেয়ে কম আঁচে ১২ থেকে ১৫ মিনিট রান্না করুন।","কাঁচা সরিষার তেল ও চেরা কাঁচা মরিচ দিয়ে গরম ভাতের সঙ্গে পরিবেশন করুন।"]},
fry:{en:["Clean the {m} and pat it very dry.","Rub with turmeric, salt and a pinch of chilli powder. Rest for 10 minutes.","Heat oil (mustard oil adds the classic aroma) until it shimmers.","Fry in a single layer, 3 to 4 minutes per side, until golden and crisp.","Drain on paper and serve hot."],
bn:["{m} পরিষ্কার করে ভালোভাবে পানি মুছে নিন।","হলুদ, লবণ ও এক চিমটি মরিচ গুঁড়া মাখিয়ে ১০ মিনিট রাখুন।","তেল (সরিষার তেলে ক্লাসিক ঘ্রাণ আসে) ঝকঝকে গরম করুন।","এক স্তরে সাজিয়ে প্রতি পাশ ৩ থেকে ৪ মিনিট ভাজুন, যতক্ষণ সোনালি ও মচমচে হয়।","কাগজে তেল ঝরিয়ে গরম গরম পরিবেশন করুন।"]},
bhuna:{en:["Heat oil and fry plenty of sliced onion until deep golden brown.","Add ginger-garlic paste, turmeric, chilli powder, cumin and coriander. Fry for 2 minutes with a splash of water.","Add the {m} and salt. Stir-fry on high heat for 10 minutes until coated and browned.","Add a little hot water, cover, and cook on low heat until tender. Add water only when needed.","Uncover and cook down until the gravy is thick and the oil separates. Finish with garam masala."],
bn:["তেল গরম করে প্রচুর কুচি পেঁয়াজ গাঢ় সোনালি করে ভাজুন।","আদা-রসুন বাটা, হলুদ, মরিচ গুঁড়া, জিরা ও ধনে গুঁড়া দিয়ে সামান্য পানিসহ ২ মিনিট কষান।","{m} ও লবণ দিয়ে উচ্চ আঁচে ১০ মিনিট নেড়ে মসলা মাখিয়ে বাদামি করুন।","অল্প গরম পানি দিয়ে ঢেকে কম আঁচে নরম হওয়া পর্যন্ত রান্না করুন। দরকার হলেই কেবল পানি দিন।","ঢাকনা খুলে ঘন ঝোল ও তেল ছেড়ে আসা পর্যন্ত কষান। শেষে গরম মসলা ছড়িয়ে দিন।"]},
rezala:{en:["Heat ghee and fry sliced onion until pale gold. Add ginger-garlic paste and whole spices.","Add the {m} and fry for 5 minutes. Turn the heat low.","Whisk yoghurt until smooth and add it slowly with salt and green chilli, stirring so it does not split.","Add a paste of cashew nuts, cover, and cook on low heat until tender.","Finish with a few drops of kewra water and a spoon of ghee. Serve with polao."],
bn:["ঘি গরম করে কুচি পেঁয়াজ হালকা সোনালি করে ভাজুন। আদা-রসুন বাটা ও গোটা মসলা দিন।","{m} দিয়ে ৫ মিনিট ভাজুন। আঁচ কমিয়ে দিন।","দই ফেটিয়ে মসৃণ করে ধীরে ধীরে লবণ ও কাঁচা মরিচসহ দিন, নাড়তে থাকুন যেন না ফেটে যায়।","কাজুবাদামের বাটা দিয়ে ঢেকে কম আঁচে নরম হওয়া পর্যন্ত রান্না করুন।","কয়েক ফোঁটা কেওড়া জল ও এক চামচ ঘি দিয়ে নামান। পোলাওয়ের সঙ্গে পরিবেশন করুন।"]},
roast:{en:["Marinate the {m} with yoghurt, ginger-garlic paste, salt and a little sugar for 1 hour.","Fry onion paste in oil and ghee until fragrant. Add chilli, cumin and whole spices.","Add the marinated chicken and fry until it changes colour.","Add a little water and cook covered until the chicken is tender and the gravy thick.","Finish with a spoon of ghee and a few fried onions on top."],
bn:["{m} দই, আদা-রসুন বাটা, লবণ ও সামান্য চিনি দিয়ে ১ ঘণ্টা মেখে রাখুন।","তেল ও ঘিতে পেঁয়াজ বাটা সুবাস না আসা পর্যন্ত ভাজুন। মরিচ, জিরা ও গোটা মসলা দিন।","মাখানো মুরগি দিয়ে রং বদলানো পর্যন্ত ভাজুন।","অল্প পানি দিয়ে ঢেকে নরম ও ঘন ঝোল না হওয়া পর্যন্ত রান্না করুন।","এক চামচ ঘি ও ওপরে কিছু বেরেস্তা দিয়ে পরিবেশন করুন।"]},
stew:{en:["Brown the {m} in oil with sliced onion, then add ginger-garlic paste.","Add chilli, turmeric, cumin, coriander and whole spices. Fry for 3 minutes.","Add plenty of water, cover, and cook on the lowest heat for 3 to 6 hours, until the meat falls off the bone.","Stir in wheat flour mixed with water to thicken the broth slightly.","Top with ginger strips, green chilli and coriander. Serve very hot."],
bn:["তেলে কুচি পেঁয়াজসহ {m} বাদামি করে ভাজুন, তারপর আদা-রসুন বাটা দিন।","মরিচ, হলুদ, জিরা, ধনে ও গোটা মসলা দিয়ে ৩ মিনিট কষান।","প্রচুর পানি দিয়ে ঢেকে সবচেয়ে কম আঁচে ৩ থেকে ৬ ঘণ্টা রান্না করুন, যতক্ষণ না মাংস হাড় থেকে খুলে আসে।","পানিতে গোলানো আটা ঝোলে দিয়ে সামান্য ঘন করুন।","আদা কুচি, কাঁচা মরিচ ও ধনেপাতা দিয়ে খুব গরম পরিবেশন করুন।"]},
haleem:{en:["Soak the wheat and lentils overnight.","Cook the {m} with onion, ginger-garlic paste and spices until tender, then shred it.","Boil the soaked grains and lentils until very soft, then add the shredded meat.","Mash and beat with a wooden spoon on low heat for 30 minutes until smooth and stretchy.","Serve topped with fried onion, ginger strips, green chilli, coriander and lime."],
bn:["গম ও ডাল সারা রাত ভিজিয়ে রাখুন।","{m} পেঁয়াজ, আদা-রসুন বাটা ও মসলাসহ নরম হওয়া পর্যন্ত রান্না করে ছিঁড়ে নিন।","ভেজানো গম ও ডাল খুব নরম হওয়া পর্যন্ত সেদ্ধ করে ছেঁড়া মাংস মিশিয়ে নিন।","কম আঁচে কাঠের চামচ দিয়ে ৩০ মিনিট ঘুঁটে মসৃণ ও টানটান করুন।","বেরেস্তা, আদা কুচি, কাঁচা মরিচ, ধনেপাতা ও লেবু দিয়ে পরিবেশন করুন।"]},
curry:{en:["Wash the {m} and marinate with salt, turmeric and a spoon of yoghurt for 30 minutes.","Fry sliced onion in oil until golden. Add ginger-garlic paste, chilli, cumin and coriander.","Add the {m} (and potato, or a special ingredient such as shatkora or chui jhal). Stir-fry on high heat for 8 minutes.","Add hot water to cover, then simmer with the lid on until tender (about 1 hour for goat or beef, 25 minutes for chicken).","Adjust the salt, sprinkle coriander, and serve with rice or paratha."],
bn:["{m} ধুয়ে লবণ, হলুদ ও এক চামচ দই মেখে ৩০ মিনিট রাখুন।","তেলে কুচি পেঁয়াজ সোনালি করে ভাজুন। আদা-রসুন বাটা, মরিচ, জিরা ও ধনে দিন।","{m} (এবং আলু, বা সাতকরা ও চুইঝালের মতো বিশেষ উপকরণ) দিয়ে উচ্চ আঁচে ৮ মিনিট নেড়ে ভাজুন।","ডুবে যাওয়ার মতো গরম পানি দিয়ে ঢেকে নরম হওয়া পর্যন্ত রান্না করুন (গরু বা খাসি প্রায় ১ ঘণ্টা, মুরগি ২৫ মিনিট)।","লবণ ঠিক করে ধনেপাতা ছিটিয়ে ভাত বা পরোটার সঙ্গে পরিবেশন করুন।"]},
kebab:{en:["Mix the {m} with ginger-garlic paste, chilli, cumin, coriander, chopped coriander leaves, salt and a little gram flour.","Rest the mixture for 30 minutes.","Shape into skewers or flat patties with oiled hands.","Grill, or pan-fry in a little oil, turning until browned and cooked through.","Serve hot with onion rings, lime and chutney."],
bn:["{m} আদা-রসুন বাটা, মরিচ, জিরা, ধনে, কুচানো ধনেপাতা, লবণ ও সামান্য বেসনের সঙ্গে মেশান।","মিশ্রণটি ৩০ মিনিট রেখে দিন।","তেল মাখা হাতে শিকে বা চ্যাপ্টা পাটির মতো আকার দিন।","গ্রিল করুন অথবা অল্প তেলে উল্টে-পাল্টে বাদামি ও সেদ্ধ হওয়া পর্যন্ত ভাজুন।","পেঁয়াজের রিং, লেবু ও চাটনির সঙ্গে গরম পরিবেশন করুন।"]},
bhorta:{en:["Roast or boil the {m} until soft. Char it over a flame for a smoky taste.","Peel and mash it in a bowl.","Add chopped onion, green chilli, coriander leaves and salt.","Pour a spoonful of raw mustard oil over the top.","Mix with your hands and serve beside hot rice."],
bn:["{m} আগুনে পুড়িয়ে বা সেদ্ধ করে নরম করে নিন। ধোঁয়াটে স্বাদের জন্য আগুনে ঝলসান।","খোসা ছাড়িয়ে বাটিতে চটকে নিন।","কুচি পেঁয়াজ, কাঁচা মরিচ, ধনেপাতা ও লবণ দিন।","ওপরে এক চামচ কাঁচা সরিষার তেল ঢালুন।","হাত দিয়ে মেখে গরম ভাতের পাশে পরিবেশন করুন।"]},
shak:{en:["Wash the {m} well and chop roughly. Drain completely.","Heat oil and fry whole garlic and dried chilli until fragrant.","Add the greens and salt. Do not add water.","Stir-fry on medium heat for 4 to 5 minutes until just wilted.","Serve warm with rice and dal."],
bn:["{m} ভালো করে ধুয়ে মোটা করে কেটে পানি ঝরিয়ে নিন।","তেল গরম করে গোটা রসুন ও শুকনো মরিচ ভাজুন।","শাক ও লবণ দিন। পানি দেবেন না।","মাঝারি আঁচে ৪ থেকে ৫ মিনিট নেড়ে শুধু নরম করুন।","ভাত ও ডালের সঙ্গে গরম পরিবেশন করুন।"]},
sabzi:{en:["Cut the {m} and other vegetables into even pieces.","Heat oil and add panch phoron (or cumin) and a dried chilli. Let them crackle.","Add the vegetables (and prawns or dried fish if the dish uses them), turmeric and salt. Stir for 2 minutes.","Add a splash of water, cover, and cook on low heat until soft.","Uncover, cook off the extra water, and finish with a pinch of sugar and a little ghee."],
bn:["{m} ও অন্যান্য সবজি সমান টুকরা করে কেটে নিন।","তেল গরম করে পাঁচফোড়ন (বা জিরা) ও একটি শুকনো মরিচ ফোড়ন দিন।","সবজি (এবং রেসিপিতে থাকলে চিংড়ি বা শুঁটকি), হলুদ ও লবণ দিয়ে দুই মিনিট নাড়ুন।","সামান্য পানি দিয়ে ঢেকে কম আঁচে নরম হওয়া পর্যন্ত রান্না করুন।","ঢাকনা খুলে বাড়তি পানি শুকিয়ে এক চিমটি চিনি ও সামান্য ঘি দিয়ে নামান।"]},
dal:{en:["Rinse the {m} and boil it with turmeric, salt and 4 cups of water until soft.","Whisk or mash lightly to a smooth, pourable texture.","In a small pan, heat oil or ghee and fry sliced onion, garlic, cumin and a dried chilli. This is the bhaghar.","Pour the hot tempering into the dal. It will sizzle.","Simmer for 2 minutes, add coriander leaves, and serve with rice."],
bn:["{m} ধুয়ে হলুদ, লবণ ও চার কাপ পানিসহ নরম হওয়া পর্যন্ত সেদ্ধ করুন।","ঘুঁটনি দিয়ে হালকা ঘুঁটে মসৃণ ও ঢালার উপযোগী করুন।","ছোট প্যানে তেল বা ঘি গরম করে কুচি পেঁয়াজ, রসুন, জিরা ও শুকনো মরিচ ভাজুন। একে বলে বাঘার।","গরম বাঘার ডালে ঢেলে দিন। ছ্যাঁক করে উঠবে।","২ মিনিট ফুটিয়ে ধনেপাতা দিয়ে ভাতের সঙ্গে পরিবেশন করুন।"]},
fritter:{en:["Whisk gram flour (or lentil paste) with salt, chilli, a pinch of turmeric and water into a thick batter.","Prepare the {m}: slice, chop or mix it into the batter as needed.","Heat oil for deep frying until a drop of batter rises right away.","Fry in batches until golden and crisp.","Drain on paper and serve hot with chutney or tea."],
bn:["বেসন (বা ডালের বাটা), লবণ, মরিচ, এক চিমটি হলুদ ও পানি মিশিয়ে ঘন গোলা তৈরি করুন।","{m} প্রস্তুত করুন: কেটে বা কুচি করে নিন, দরকারমতো গোলায় মেশান।","ডুবো তেল গরম করুন, এক ফোঁটা গোলা দিলে যেন সঙ্গে সঙ্গে ভেসে ওঠে।","কয়েক ভাগে সোনালি ও মচমচে করে ভাজুন।","কাগজে তেল ঝরিয়ে চাটনি বা চায়ের সঙ্গে গরম পরিবেশন করুন।"]},
pastry:{en:["Make a stiff dough from flour, a little oil, salt and water. Rest for 30 minutes.","Cook the {m} filling with onion, chilli, cumin and salt until dry.","Roll the dough thin, cut and shape into cones, fill, and seal the edges with water.","Heat oil on medium and fry the pastries slowly until golden and crisp.","Drain and serve hot with tomato sauce or chutney."],
bn:["ময়দা, সামান্য তেল, লবণ ও পানি দিয়ে শক্ত খামির বানিয়ে ৩০ মিনিট রাখুন।","{m} পুর পেঁয়াজ, মরিচ, জিরা ও লবণ দিয়ে শুকনো করে রান্না করুন।","খামির পাতলা বেলে কেটে কোণাকার করুন, পুর ভরে কিনারা পানি দিয়ে আটকান।","মাঝারি আঁচের তেলে ধীরে ধীরে সোনালি ও মচমচে করে ভাজুন।","তেল ঝরিয়ে টমেটো সস বা চাটনির সঙ্গে গরম পরিবেশন করুন।"]},
chop:{en:["Boil the {m} and mash it with chopped onion, chilli, coriander and salt.","Shape into balls or ovals. For dimer chop, wrap the potato around a boiled egg.","Dip in beaten egg.","Roll in breadcrumbs.","Deep fry until golden and serve hot."],
bn:["{m} সেদ্ধ করে কুচি পেঁয়াজ, মরিচ, ধনেপাতা ও লবণসহ চটকে নিন।","গোল বা ডিম্বাকৃতি করুন। ডিমের চপের জন্য সেদ্ধ ডিমের চারপাশে আলু জড়িয়ে নিন।","ফেটানো ডিমে ডুবিয়ে নিন।","রুটির গুঁড়ায় গড়িয়ে নিন।","ডুবো তেলে সোনালি করে ভেজে গরম পরিবেশন করুন।"]},
nimki:{en:["Mix flour, a spoon of ghee, nigella seeds and salt with water into a firm dough. Rest for 20 minutes.","Roll out thin and cut into small diamonds.","Heat oil on medium and fry slowly until pale gold and crisp.","Cool completely and store in a tin."],
bn:["ময়দা, এক চামচ ঘি, কালোজিরা ও লবণ পানিতে মেখে শক্ত খামির বানিয়ে ২০ মিনিট রাখুন।","পাতলা বেলে ছোট ডায়মন্ড আকারে কেটে নিন।","মাঝারি আঁচের তেলে ধীরে ধীরে হালকা সোনালি ও মচমচে করে ভাজুন।","পুরো ঠান্ডা করে কৌটায় ভরে রাখুন।"]},
paratha:{en:["Knead wheat flour with water, salt and a spoon of oil into a soft dough. Rest for 30 minutes.","Roll each ball thin, brush with ghee, fold into layers, and roll again.","Cook on a hot griddle, brushing both sides with oil.","Cook until golden with brown spots, then crush gently to open the layers.","Serve hot with bhaji, dal or beef bhuna."],
bn:["আটা, পানি, লবণ ও এক চামচ তেল মেখে নরম খামির বানিয়ে ৩০ মিনিট রাখুন।","প্রতিটি লেচি পাতলা বেলে ঘি মাখিয়ে ভাঁজ করে আবার বেলুন।","গরম তাওয়ায় দুই পাশে তেল দিয়ে সেঁকুন।","সোনালি ও বাদামি ছোপ এলে আলতো চেপে স্তর খুলে নিন।","ভাজি, ডাল বা গরুর ভুনার সঙ্গে গরম পরিবেশন করুন।"]},
ruti:{en:["Knead wheat flour with water and a pinch of salt into a soft dough. Rest for 20 minutes.","Roll small balls into thin rounds.","Cook on a hot dry tawa until bubbles form, flip, and cook the other side.","Hold briefly over an open flame to puff, if you like. Serve hot."],
bn:["আটা, পানি ও এক চিমটি লবণ মেখে নরম খামির বানিয়ে ২০ মিনিট রাখুন।","লেচি গোল ও পাতলা করে বেলুন।","গরম শুকনো তাওয়ায় বুদবুদ উঠলে উল্টে অন্য পাশ সেঁকুন।","চাইলে সামান্য আগুনে ধরে ফুলিয়ে নিন। গরম পরিবেশন করুন।"]},
luchi:{en:["Knead plain flour with salt, a spoon of ghee and water into a firm, smooth dough.","Divide into small balls and roll each into a thin round.","Heat oil until very hot. Slide in one round and press gently with a spoon so it puffs.","Fry both sides lightly. They should stay pale. Then drain.","Serve at once with cholar dal or aloo."],
bn:["ময়দা, লবণ, এক চামচ ঘি ও পানি মেখে শক্ত মসৃণ খামির বানান।","ছোট লেচি করে প্রতিটি পাতলা গোল করে বেলুন।","তেল খুব গরম করে একটি লুচি ছেড়ে চামচ দিয়ে চাপ দিন, ফুলে উঠবে।","দুই পাশ হালকা ভাজুন, রঙ ফ্যাকাশে থাকবে। তারপর তুলে নিন।","এখনই ছোলার ডাল বা আলুর সঙ্গে পরিবেশন করুন।"]},
bakarkhani:{en:["Knead flour with ghee, salt and milk into a firm dough. Rest for 1 hour.","Roll very thin, brush with ghee and flour paste, roll into a spiral and flatten into thick discs.","Brush the top with milk and bake in a hot oven or covered pan until deep gold.","Cool until crisp. Dip in tea or eat with nihari."],
bn:["ময়দা, ঘি, লবণ ও দুধ মেখে শক্ত খামির বানিয়ে ১ ঘণ্টা রাখুন।","খুব পাতলা বেলে ঘি-ময়দার পেস্ট মাখিয়ে প্যাঁচিয়ে মোটা চাকতি বানান।","ওপরে দুধ মাখিয়ে গরম ওভেনে বা ঢাকা প্যানে গাঢ় সোনালি করে সেঁকুন।","ঠান্ডা হয়ে মচমচে হলে চায়ে ডুবিয়ে বা নিহারির সঙ্গে খান।"]},
dalpuri:{en:["Soak the lentils for 2 hours and boil until soft. Drain and mash with cumin, chilli and salt.","Make a soft flour dough and divide into balls.","Flatten each ball, fill with a spoon of the lentil mix, close, and roll thin.","Fry in hot oil until puffed and golden.","Serve hot with bhaji or tea."],
bn:["ডাল ২ ঘণ্টা ভিজিয়ে সেদ্ধ করে পানি ঝরিয়ে জিরা, মরিচ ও লবণ দিয়ে চটকে নিন।","ময়দার নরম খামির বানিয়ে লেচি করুন।","লেচি চ্যাপ্টা করে এক চামচ ডালের পুর দিয়ে মুড়ে পাতলা বেলুন।","গরম তেলে ফুলিয়ে সোনালি করে ভাজুন।","ভাজি বা চায়ের সঙ্গে গরম পরিবেশন করুন।"]},
assemble:{en:["Rinse the {m} quickly and drain.","Soak in cold water or milk for 5 minutes until soft.","Top with thick yoghurt and grated jaggery.","Add sliced banana or mango if you like."],
bn:["{m} একবার ধুয়ে পানি ঝরান।","ঠান্ডা পানি বা দুধে ৫ মিনিট ভিজিয়ে নরম করুন।","ওপরে ঘন দই ও গুড় ছড়ান।","চাইলে কলা বা আম কেটে দিন।"]},
chaat:{en:["Boil chickpeas and potato until soft. Mash lightly and toss with chilli, cumin, salt and chopped onion.","Make tamarind water: tamarind pulp, water, black salt, chilli, mint and a pinch of sugar.","For fuchka, prepare the crisp shells. For chotpoti, crush a few crisps.","Assemble just before eating: fill the shells or a bowl with the chickpea mix, then add tamarind sauce, onion, and egg slices or chutney.","Eat right away so everything stays crisp."],
bn:["ছোলা ও আলু সেদ্ধ করে হালকা চটকে মরিচ, জিরা, লবণ ও কুচি পেঁয়াজ মেশান।","তেঁতুলের পাল্প, পানি, কালো লবণ, মরিচ, পুদিনা ও এক চিমটি চিনি দিয়ে টক পানি বানান।","ফুচকার জন্য মচমচে খোসা, চটপটির জন্য কয়েকটি ফুচকা ভেঙে রাখুন।","খাওয়ার ঠিক আগে সাজান: খোসা বা বাটিতে ছোলার মিশ্রণ, তারপর টক পানি, পেঁয়াজ, ডিমের টুকরা বা চাটনি।","সঙ্গে সঙ্গে খান, যেন সব মচমচে থাকে।"]},
jhalmuri:{en:["Chop onion, green chilli, tomato and coriander leaves finely.","Put the puffed rice in a large bowl.","Add chanachur, peanuts, salt, chilli powder and the chopped vegetables.","Drizzle mustard oil and squeeze in lime.","Toss quickly and serve in a paper cone."],
bn:["পেঁয়াজ, কাঁচা মরিচ, টমেটো ও ধনেপাতা কুচি করুন।","বড় বাটিতে মুড়ি নিন।","চানাচুর, চিনাবাদাম, লবণ, মরিচ গুঁড়া ও কুচানো সবজি দিন।","সরিষার তেল ছিটিয়ে লেবু চিপে দিন।","দ্রুত মাখিয়ে ঠোঙায় পরিবেশন করুন।"]},
bhapa:{en:["Roast rice flour lightly in a dry pan until fragrant, then sift it.","Sprinkle a little warm water and rub until the flour clumps loosely, like damp sand.","Fill a small clay or steel mould with flour, put grated coconut and date molasses in the middle, then cover with more flour.","Place the mould over a steaming pot and steam for 5 to 7 minutes.","Turn out carefully and eat hot."],
bn:["শুকনো কড়াইয়ে চালের গুঁড়া হালকা ভেজে সুবাস এলে চেলে নিন।","অল্প গরম পানি ছিটিয়ে হাতে ঘষে ভেজা বালির মতো দানা দানা করুন।","ছোট মাটির বা স্টিলের ছাঁচে গুঁড়া ভরে মাঝখানে নারকেল কোরা ও খেজুর গুড় দিন, ওপরে আরও গুঁড়া দিন।","ফুটন্ত পানির ওপর বসিয়ে ৫ থেকে ৭ মিনিট ভাপ দিন।","সাবধানে বের করে গরম গরম খান।"]},
chitoi:{en:["Mix rice flour with water and a pinch of salt into a thin batter.","Heat a clay (or heavy) pan with a lid and grease it lightly.","Pour in a ladle of batter, cover, and cook for 2 minutes until it puffs and holes appear.","Stack and serve hot with date molasses or bhorta."],
bn:["চালের গুঁড়া, পানি ও এক চিমটি লবণ মিশিয়ে পাতলা গোলা বানান।","ঢাকনাসহ মাটির (বা ভারী) খোলা গরম করে সামান্য তেল মাখান।","এক হাতা গোলা ঢেলে ঢেকে ২ মিনিট রাখুন, ফুলে ছিদ্র দেখা দিলে হয়ে গেছে।","স্তূপ করে খেজুর গুড় বা ভর্তার সঙ্গে গরম পরিবেশন করুন।"]},
patishapta:{en:["Mix rice flour, plain flour and semolina with milk and water into a thin batter.","Cook grated coconut with jaggery until sticky, for the filling.","Pour a thin crepe on a greased pan and cook one side only.","Place filling on the crepe and roll it up while still warm.","Serve warm or cold."],
bn:["চালের গুঁড়া, ময়দা ও সুজি দুধ-পানিতে গুলে পাতলা গোলা বানান।","পুরের জন্য নারকেল কোরা গুড়ে আঠালো হওয়া পর্যন্ত রান্না করুন।","তেল মাখানো প্যানে পাতলা করে গোলা ঢেলে শুধু এক পাশ সেঁকুন।","রুটির ওপর পুর দিয়ে গরম থাকতেই মুড়ে নিন।","গরম বা ঠান্ডা পরিবেশন করুন।"]},
puli:{en:["Make a soft dough with rice flour and hot water. Cover it.","Mix grated coconut and jaggery for the filling.","Shape small balls of dough, flatten, add filling, and fold into a crescent.","Steam or fry the pulis. For dudh puli, simmer them in sweetened milk with cardamom for 10 minutes.","Serve warm."],
bn:["চালের গুঁড়া গরম পানিতে মেখে নরম খামির করে ঢেকে রাখুন।","নারকেল কোরা ও গুড় মিশিয়ে পুর বানান।","খামির থেকে ছোট গোল নিয়ে চ্যাপ্টা করে পুর ভরে অর্ধচন্দ্রাকারে ভাঁজ করুন।","ভাপে সেদ্ধ বা ভেজে নিন। দুধ পুলির জন্য এলাচ-চিনির দুধে ১০ মিনিট ফুটিয়ে নিন।","গরম পরিবেশন করুন।"]},
fryPitha:{en:["Mix rice flour with water, a little sugar or jaggery and a pinch of salt into a thick batter or dough.","Shape the pitha. For nakshi, press patterns with a carving tool. For tel pitha, drop spoonfuls of batter.","Heat oil and fry slowly until golden.","If you like, dip briefly in warm sugar or jaggery syrup.","Cool and serve."],
bn:["চালের গুঁড়া পানি, সামান্য চিনি বা গুড় ও এক চিমটি লবণে মেখে ঘন গোলা বা খামির বানান।","পিঠার আকার দিন। নকশি পিঠায় ছাঁচ দিয়ে নকশা বসান, তেল পিঠায় চামচে গোলা ঢালুন।","তেল গরম করে ধীরে সোনালি করে ভাজুন।","চাইলে গরম চিনি বা গুড়ের রসে এক নিমেষ ডুবিয়ে নিন।","ঠান্ডা করে পরিবেশন করুন।"]},
rasgulla:{en:["Boil 1 litre of full-cream milk. Add lemon juice slowly until it curdles.","Strain through muslin, rinse with cold water, and squeeze out the water.","Knead the curd cheese for 5 to 8 minutes until smooth and soft.","Shape into balls (ovals for chomchom) and simmer in light sugar syrup for 15 to 20 minutes.","Cool completely and chill before serving."],
bn:["১ লিটার ফুল ক্রিম দুধ ফুটিয়ে ধীরে ধীরে লেবুর রস দিন, ছানা কেটে যাবে।","মসলিনের কাপড়ে ছেঁকে ঠান্ডা পানিতে ধুয়ে পানি নিংড়ে নিন।","ছানা ৫ থেকে ৮ মিনিট মসৃণ ও নরম হওয়া পর্যন্ত মথুন।","গোল (চমচমের জন্য লম্বাটে) আকার দিয়ে হালকা চিনির রসে ১৫ থেকে ২০ মিনিট ফুটান।","পুরোপুরি ঠান্ডা করে ফ্রিজে রেখে পরিবেশন করুন।"]},
roshmalai:{en:["Curdle the milk with lemon juice, strain, and knead the curd cheese until smooth.","Shape flat discs and simmer in light sugar syrup for 15 minutes.","Separately, reduce milk until thick and flavour it with sugar, cardamom and saffron.","Gently press the syrup out of the discs and lower them into the thick milk.","Top with nuts and serve chilled."],
bn:["দুধ ফুটিয়ে লেবুর রসে ছানা কাটিয়ে ছেঁকে মথে মসৃণ করুন।","চ্যাপ্টা চাকতি বানিয়ে হালকা চিনির রসে ১৫ মিনিট ফুটান।","আলাদা পাত্রে দুধ ঘন করে চিনি, এলাচ ও জাফরান মেশান।","চাকতিগুলো হালকা চেপে রস ঝরিয়ে ঘন দুধে ডোবান।","বাদাম ছড়িয়ে ঠান্ডা পরিবেশন করুন।"]},
sandesh:{en:["Curdle milk, strain, rinse and drain the curd cheese.","Knead until smooth and mix in sugar and cardamom.","Cook on the lowest heat, stirring, until soft and starting to leave the pan.","Shape in moulds or by hand, press in a nut, and chill."],
bn:["দুধ কাটিয়ে ছানা ছেঁকে ধুয়ে পানি ঝরান।","ছানা মথে মসৃণ করে চিনি ও এলাচ মেশান।","কড়াইয়ে খুব কম আঁচে নরম হয়ে কড়াই ছাড়তে শুরু করা পর্যন্ত নাড়ুন।","ছাঁচে বা হাতে আকার দিয়ে বাদাম বসিয়ে ঠান্ডা করুন।"]},
jamun:{en:["Mix milk powder, a spoon of flour and a little ghee, then add milk to make a soft dough.","Shape smooth, crack-free balls.","Fry on low heat until golden brown. For kalojam, fry until deep brown, almost black.","Make a syrup of sugar, water and cardamom, and soak the fried balls in warm syrup for at least 1 hour.","Serve warm."],
bn:["গুঁড়া দুধ, এক চামচ ময়দা ও সামান্য ঘি মিশিয়ে দুধ দিয়ে নরম খামির বানান।","ফাটলহীন মসৃণ গোল বানান।","কম আঁচে সোনালি বাদামি করে ভাজুন। কালোজামে গাঢ় বাদামি, প্রায় কালো করে ভাজুন।","চিনি, পানি ও এলাচ ফুটিয়ে রস করে গরম রসে অন্তত ১ ঘণ্টা ভিজিয়ে রাখুন।","গরম পরিবেশন করুন।"]},
pudding:{en:["Boil the milk and reduce it by one quarter, stirring so it does not stick.","Add the {m} and cook gently until soft. For payesh use fragrant rice, for shemai roast the vermicelli in ghee first, for firni use a ground rice paste.","Add sugar or jaggery (jaggery only after taking it off the heat) and cardamom.","Cook until creamy. Pour into bowls or clay cups.","Cool, chill, and top with nuts and raisins."],
bn:["দুধ ফুটিয়ে এক-চতুর্থাংশ কমিয়ে নিন, মাঝে মাঝে নাড়ুন যেন লেগে না যায়।","{m} দিয়ে নরম হওয়া পর্যন্ত আস্তে আস্তে রান্না করুন। পায়েসে সুগন্ধি চাল, সেমাই ঘিয়ে ভেজে নিন, ফিরনিতে চালবাটা দিন।","চিনি বা গুড় (গুড় নামানোর পর) ও এলাচ দিন।","ক্রিমের মতো হলে বাটি বা মাটির কাপে ঢালুন।","ঠান্ডা করে বাদাম-কিশমিশ ছড়িয়ে পরিবেশন করুন।"]},
doi:{en:["Boil milk and reduce it by a third. Caramelise sugar in a pan until amber and stir it into the milk.","Cool until just warm. Whisk in a spoon of plain yoghurt as a starter.","Pour into clay pots and cover.","Leave in a warm place for 8 to 10 hours until set.","Chill before serving."],
bn:["দুধ ফুটিয়ে এক-তৃতীয়াংশ কমান। প্যানে চিনি ক্যারামেল করে দুধে মেশান।","হালকা গরম থাকতে এক চামচ টক দই ফেটিয়ে দিন।","মাটির পাত্রে ঢেলে ঢেকে দিন।","উষ্ণ জায়গায় ৮ থেকে ১০ ঘণ্টা রাখলে জমে যাবে।","ঠান্ডা করে পরিবেশন করুন।"]},
jilapi:{en:["Mix flour, rice flour, a little yoghurt and water into a thick batter. Ferment for 8 hours.","Make a sticky syrup of sugar, water and cardamom.","Pour the batter into a bottle or piping bag and fry spirals in hot oil until crisp.","Dip into warm syrup for 20 seconds.","Serve warm."],
bn:["ময়দা, চালের গুঁড়া, সামান্য দই ও পানি মিশিয়ে ঘন গোলা করে ৮ ঘণ্টা গাঁজতে দিন।","চিনি, পানি ও এলাচ দিয়ে আঠালো রস বানান।","গোলা বোতল বা পাইপিং ব্যাগে ভরে গরম তেলে পেঁচিয়ে মচমচে করে ভাজুন।","গরম রসে ২০ সেকেন্ড ডুবিয়ে তুলুন।","গরম পরিবেশন করুন।"]},
moa:{en:["Boil jaggery with a splash of water until it forms a thick syrup.","Add the {m} and coconut and mix quickly.","With oiled hands, shape into tight balls while still warm.","Rest until firm."],
bn:["গুড় সামান্য পানিতে ফুটিয়ে ঘন রস বানান।","{m} ও নারকেল দিয়ে দ্রুত মিশিয়ে নিন।","তেল মাখা হাতে গরম থাকতে শক্ত করে বল বানান।","শক্ত না হওয়া পর্যন্ত রেখে দিন।"]},
jorda:{en:["Wash and soak the rice for 30 minutes, then boil with saffron or yellow colour until 80 percent cooked. Drain.","Layer in a pot with sugar, ghee, raisins and whole spices.","Cover tightly and cook on the lowest heat for 20 minutes.","Rest for 10 minutes and mix gently."],
bn:["চাল ধুয়ে ৩০ মিনিট ভিজিয়ে জাফরান বা হলুদ রঙসহ ৮০ শতাংশ সেদ্ধ করে পানি ঝরান।","হাঁড়িতে চিনি, ঘি, কিশমিশ ও গোটা মসলাসহ স্তরে স্তরে সাজান।","শক্ত করে ঢেকে সবচেয়ে কম আঁচে ২০ মিনিট রান্না করুন।","১০ মিনিট রেখে আলতো করে মিশিয়ে নিন।"]},
shahi:{en:["Cut bread into triangles and fry in ghee until golden.","Boil milk with sugar and cardamom until reduced to a thick rabri.","Dip the fried bread briefly in sugar syrup and arrange on a plate.","Pour the rabri over and top with nuts."],
bn:["পাউরুটি ত্রিকোণ করে কেটে ঘিয়ে সোনালি করে ভাজুন।","দুধ চিনি ও এলাচসহ ঘন রাবড়ি হওয়া পর্যন্ত ফুটান।","ভাজা রুটি চিনির রসে এক নিমেষ ডুবিয়ে প্লেটে সাজান।","ওপরে রাবড়ি ঢেলে বাদাম ছড়ান।"]},
milkreduce:{en:["Heat the milk in a wide pan and cook, stirring, until reduced by half.","For halua, add grated carrot and cook until soft.","Add sugar and ghee and keep stirring until thick and no longer sticky.","Add cardamom and nuts. Serve warm, or set in a tray and cut into pieces."],
bn:["চওড়া প্যানে দুধ নেড়ে নেড়ে অর্ধেক হওয়া পর্যন্ত ফুটান।","হালুয়া বানালে গাজর কোরা দিয়ে নরম হওয়া পর্যন্ত রান্না করুন।","চিনি ও ঘি দিয়ে ঘন ও আঠা ছেড়ে আসা পর্যন্ত নাড়তে থাকুন।","এলাচ ও বাদাম দিন। গরম পরিবেশন করুন, অথবা ট্রেতে জমিয়ে টুকরা করুন।"]},
shorbot:{en:["Squeeze or scoop the {m} into a jug.","Add sugar and a pinch of salt and stir until dissolved.","Add cold water and ice.","Taste, adjust the sweetness, and serve chilled."],
bn:["জগে {m} চিপে বা চামচে তুলে নিন।","চিনি ও এক চিমটি লবণ দিয়ে গুলুন।","ঠান্ডা পানি ও বরফ দিন।","চেখে মিষ্টি ঠিক করে ঠান্ডা পরিবেশন করুন।"]},
yogurtdrink:{en:["Blend the yoghurt with cold water until smooth.","For borhani, add ground mint, coriander leaves, green chilli, black salt, roasted cumin and mustard.","For lassi, add sugar or a pinch of salt.","Chill and serve."],
bn:["দই ঠান্ডা পানিতে ব্লেন্ড করে মসৃণ করুন।","বোরহানির জন্য বাটা পুদিনা, ধনেপাতা, কাঁচা মরিচ, কালো লবণ, ভাজা জিরা ও সরিষা দিন।","লাচ্ছির জন্য চিনি বা এক চিমটি লবণ দিন।","ঠান্ডা করে পরিবেশন করুন।"]},
tea:{en:["Boil water with tea leaves for 2 minutes.","Add milk and sugar and boil again until it rises.","Strain into small cups and serve hot."],
bn:["পানিতে চা পাতা দিয়ে ২ মিনিট ফুটান।","দুধ ও চিনি দিয়ে আবার উথলে ওঠা পর্যন্ত ফুটান।","ছেঁকে ছোট কাপে গরম পরিবেশন করুন।"]},
layertea:{en:["Make several different brews: black tea, milk tea, spiced tea, lemon tea and others, each with a different density.","Pour sugar syrup into a clear glass first.","Pour each tea slowly over the back of a spoon so the layers stay separate.","Serve without stirring."],
bn:["আলাদা ঘনত্বে কয়েকটি চা বানান: লাল চা, দুধ চা, মসলা চা, লেবু চা ইত্যাদি।","পরিষ্কার গ্লাসে প্রথমে চিনির সিরাপ ঢালুন।","চামচের পিছন দিয়ে প্রতিটি চা ধীরে ধীরে ঢালুন যেন স্তরগুলো আলাদা থাকে।","না নেড়ে পরিবেশন করুন।"]},
fresh:{en:["Choose the freshest {m} you can find. It should smell sweet and feel heavy for its size.","Wash, peel or open it just before serving.","Serve at once, chilled if you like.","Enjoy it plain, or with a pinch of salt or a squeeze of lime."],
bn:["সবচেয়ে তাজা {m} বেছে নিন। মিষ্টি ঘ্রাণ থাকবে ও আকারের তুলনায় ভারী হবে।","পরিবেশনের ঠিক আগে ধুয়ে খোসা ছাড়ান বা কেটে নিন।","সঙ্গে সঙ্গে পরিবেশন করুন, চাইলে ঠান্ডা করে।","এমনিই খান, বা এক চিমটি লবণ বা লেবু দিয়ে।"]},
muitha:{en:["Scrape the flesh of the chitol fish and mince it with onion, chilli, garlic, coriander leaves and a spoon of gram flour.","Shape small balls and fry lightly until firm.","Make a thin jhol: fry onion, turmeric, cumin and chilli in oil, then add water.","Slide the balls into the simmering gravy and cook for 8 minutes without stirring.","Serve hot with rice."],
bn:["চিতল মাছের মাংস চেঁছে কিমা করে পেঁয়াজ, রসুন, কাঁচা মরিচ, ধনেপাতা ও এক চামচ বেসনের সঙ্গে মাখুন।","ছোট বল বানিয়ে হালকা ভেজে শক্ত করে নিন।","তেলে পেঁয়াজ, হলুদ, জিরা ও মরিচ কষিয়ে পানি দিয়ে পাতলা ঝোল তৈরি করুন।","ফুটন্ত ঝোলে বলগুলো ছেড়ে ৮ মিনিট না নেড়ে রান্না করুন।","ভাতের সঙ্গে গরম পরিবেশন করুন।"]},
malai:{en:["Clean the prawns, rub with turmeric and salt, and fry lightly.","Fry onion paste, ginger and whole spices in oil and ghee.","Add the prawns and a little water. Cook for 5 minutes.","Pour in coconut milk and simmer gently. Do not boil hard.","Add sugar and ghee, adjust the salt, and serve with rice or polao."],
bn:["চিংড়ি পরিষ্কার করে হলুদ-লবণ মেখে হালকা ভেজে নিন।","তেল-ঘিতে পেঁয়াজ বাটা, আদা ও গোটা মসলা ভাজুন।","চিংড়ি ও সামান্য পানি দিয়ে ৫ মিনিট রান্না করুন।","নারকেলের দুধ ঢেলে আলতো আঁচে ফুটতে দিন, জোরে ফোটাবেন না।","চিনি ও ঘি দিয়ে লবণ ঠিক করে ভাত বা পোলাওয়ের সঙ্গে পরিবেশন করুন।"]},
eggcurry:{en:["Boil the eggs for 8 minutes, cool, peel, and prick with a fork. Rub with turmeric and salt.","Fry the eggs in oil until lightly golden. Set aside.","In the same oil fry onion, tomato, ginger-garlic paste, turmeric, chilli and cumin.","Add potato and water and simmer for 10 minutes. Return the eggs and cook for 5 minutes more.","Serve with rice or paratha."],
bn:["ডিম ৮ মিনিট সেদ্ধ করে ঠান্ডা করে খোসা ছাড়ান, কাঁটা চামচে ফুটো করে হলুদ-লবণ মাখান।","তেলে ডিম হালকা সোনালি করে ভেজে তুলে রাখুন।","একই তেলে পেঁয়াজ, টমেটো, আদা-রসুন বাটা, হলুদ, মরিচ ও জিরা কষান।","আলু ও পানি দিয়ে ১০ মিনিট ফুটিয়ে ডিম ফিরিয়ে দিয়ে আরও ৫ মিনিট রান্না করুন।","ভাত বা পরোটার সঙ্গে পরিবেশন করুন।"]},
posto:{en:["Soak poppy seeds for 15 minutes, then grind them with green chilli and salt into a paste.","Fry diced potato in mustard oil until pale gold.","Add the poppy paste and a little water. Cover and cook for 8 minutes.","Uncover and cook until the paste clings to the potato. Finish with raw mustard oil."],
bn:["পোস্তদানা ১৫ মিনিট ভিজিয়ে কাঁচা মরিচ ও লবণসহ বেটে বাটা বানান।","সরিষার তেলে কাটা আলু হালকা সোনালি করে ভাজুন।","পোস্তবাটা ও সামান্য পানি দিয়ে ঢেকে ৮ মিনিট রান্না করুন।","ঢাকনা খুলে বাটা আলুতে লেগে যাওয়া পর্যন্ত শুকান, ওপরে কাঁচা সরিষার তেল দিন।"]}
};

  $('#proverb').textContent=t('hero_proverb');$('#lede').textContent=t('hero_lede',{n:num(D.length)});$('#cta').textContent=t('hero_cta');$('#th-l').textContent=t('hero_theme');
  $('#menu-t').textContent=t('menu_title');$('#menu-s').textContent=t('menu_sub');$('#q-l').textContent=t('search_label');$('#q').placeholder=t('search_ph');
  $('#l-veg').textContent=t('f_veg');$('#l-easy').textContent=t('f_easy');$('#l-saved').textContent=t('f_saved');$('#l-spice').textContent=t('f_spice');$('#l-time').textContent=t('f_time');$('#surprise').textContent='🎲 '+t('surprise');
  var so=$('#spice').options;so[0].textContent=t('sp_any');so[1].textContent=t('sp_mild');so[2].textContent=t('sp_medium');so[3].textContent=t('sp_hot');
  var to=$('#time').options;to[0].textContent=t('tm_any');to[1].textContent=t('tm_quick');to[2].textContent=t('tm_hour');
  $('#tab-t').textContent=t('tables_title');$('#tab-s').textContent=t('tables_sub');$('#reg-t').textContent=t('regions_title');$('#reg-s').textContent=t('regions_sub');
  $('#sea-t').textContent=t('seasons_title');$('#sea-s').textContent=t('seasons_sub');$('#foot').textContent=t('foot_note');
  buildThemeRow();buildCats();buildTables();buildRegions();buildCal();applyMode();renderSun(false);
}
function buildTables(){
  var g=$('#tables-grid');g.replaceChildren();
  TABLES.forEach(function(tb){
    var a=el('article');var h=el('h3');
    var p1=el('span','pri',lang==='bn'?tb.bn:tb.en);p1.setAttribute('lang',lang==='bn'?'bn':'en');h.appendChild(p1);h.appendChild(el('span','sec',lang==='bn'?tb.en:tb.bn));
    a.appendChild(h);a.appendChild(el('p',null,L(tb.d)));var ul=el('ul');
    tb.it.forEach(function(i){ul.appendChild(el('li',null,lang==='bn'?i[1]:i[0]));});a.appendChild(ul);reveal(a);g.appendChild(a);
  });
}
function buildRegions(){
  var g=$('#regions-grid');g.replaceChildren();
  REGIONS.forEach(function(r){
    var a=el('article','region');var rs=el('div','rs');rs.innerHTML=Art.scene(r.id,'r-'+r.id);a.appendChild(rs);
    var h=el('h3');h.appendChild(el('span','pri',lang==='bn'?r.bn:r.en));h.appendChild(el('span','sec',lang==='bn'?r.en:r.bn));a.appendChild(h);
    a.appendChild(el('p',null,L(r.tag)));
    var ul=el('ul');
    r.chips.forEach(function(c){var li=el('li');var b=el('button','chip',L(c));b.type='button';b.addEventListener('click',function(){Snd.tick();searchFor(c.q);});li.appendChild(b);ul.appendChild(li);});
    a.appendChild(ul);
    var ap=el('button','apply');ap.type='button';ap.dataset.r=r.id;ap.addEventListener('click',function(){setRegion(region===r.id?'':r.id);});a.appendChild(ap);
    reveal(a);g.appendChild(a);
  });
  syncApply();
}
function buildCal(){
  var d=$('#cal');d.replaceChildren();
  CAL.forEach(function(c){var row=el('div');var dt=el('dt');dt.appendChild(el('span',null,L(c.s)));dt.appendChild(el('small',null,L(c.w)));row.appendChild(dt);row.appendChild(el('dd',null,L(c.d)));reveal(row);d.appendChild(row);});
}
function buildCats(){
  var box=$('#cats');box.replaceChildren();
  function mk(id,label,n){var b=el('button','chip');b.type='button';b.dataset.cat=id;b.appendChild(document.createTextNode(label));b.appendChild(el('small',null,num(n)));b.addEventListener('click',function(){Snd.tick();state.cat=id;syncChips();render();});box.appendChild(b);}
  mk('all',t('cat_all'),D.length);
  CATS.forEach(function(c){mk(c.id,lang==='bn'?c.bn:c.en,D.filter(function(d){return d.cat===c.id;}).length);});
  syncChips();
}
function syncChips(){document.querySelectorAll('#cats .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.cat===state.cat?'true':'false');});}

/* ---------- menu ---------- */
function match(d){
  if(state.cat!=='all'&&d.cat!==state.cat)return false;
  if(state.veg&&!d.veg)return false;
  if(state.easy&&level(d)!==1)return false;
  if(state.saved&&!isSaved(d.slug))return false;
  if(state.spice==='mild'&&d.spice>1)return false;
  if(state.spice==='medium'&&d.spice!==2)return false;
  if(state.spice==='hot'&&d.spice!==3)return false;
  if(state.time==='quick'&&d.min>30)return false;
  if(state.time==='hour'&&d.min>60)return false;
  var q=state.q.trim().toLowerCase();
  if(q&&d.hay.indexOf(q)===-1)return false;
  return true;
}
function active(){return state.q.trim()!==''||state.cat!=='all'||state.veg||state.easy||state.saved||state.spice!=='any'||state.time!=='any';}
function dishEl(d){
  var a=el('article','dish');a.style.setProperty('--c','var(--c-'+d.cat+')');
  var pic=el('div','pic');pic.innerHTML=Art.draw(d.art,d.slug);a.appendChild(pic);
  var body=el('div');var h=el('h4');var b=el('button','nm');b.type='button';b.setAttribute('aria-label',t('open_recipe',{name:pri(d)}));
  var p1=el('span','pri',pri(d));p1.setAttribute('lang',lang==='bn'?'bn':'en');var p2=el('span','sec',sec(d));p2.setAttribute('lang',lang==='bn'?'en':'bn');
  b.appendChild(p1);b.appendChild(p2);b.addEventListener('click',function(){openDish(d.slug,b);});h.appendChild(b);body.appendChild(h);
  body.appendChild(el('p','d',d.desc[lang]));
  var meta=el('p','meta');
  if(d.spice>0){var sp=el('span','spice');sp.setAttribute('role','img');sp.setAttribute('aria-label',t('spice_lbl',{n:num(d.spice)}));for(var i=1;i<=3;i++){sp.appendChild(el('span','chili'+(i<=d.spice?' on':'')));}meta.appendChild(sp);}
  meta.appendChild(el('span',null,num(d.min)+' '+t('min')+' · '+t('lvl'+level(d))));
  if(d.veg)meta.appendChild(el('span','tag',t('tag_veg')));
  if(noteOf(d))meta.appendChild(el('span',null,noteOf(d)));
  body.appendChild(meta);a.appendChild(body);
  a.appendChild(favBtn(d));
  return a;
}
function favBtn(d){
  var f=el('button','fav','♥');f.type='button';
  function sync(){var s=isSaved(d.slug);f.setAttribute('aria-pressed',s?'true':'false');f.setAttribute('aria-label',t(s?'fav_del':'fav_add',{name:pri(d)}));}
  sync();f.addEventListener('click',function(){toggleSave(d.slug);sync();f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');});
  f.addEventListener('sync',sync);return f;
}
function toggleSave(slug){
  var i=saved.indexOf(slug),d=BY[slug];
  if(i>-1){saved.splice(i,1);toast(t('toast_removed',{name:pri(d)}));Snd.tick();}else{saved.push(slug);toast(t('toast_saved',{name:pri(d)}));Snd.heart();}
  store.set('saved',saved);$('#list-n').textContent=num(saved.length);
  document.querySelectorAll('.fav').forEach(function(f){f.dispatchEvent(new Event('sync'));});
  var rs=$('#r-save');if(rs&&cur&&cur.slug===slug){rs.setAttribute('aria-pressed',isSaved(slug)?'true':'false');rs.textContent='♥ '+t(isSaved(slug)?'saved':'save');}
  if($('#listdlg').open)renderList();
  if(state.saved)render();
}
function render(){
  var list=D.filter(match),res=$('#results'),cnt=$('#count');
  res.replaceChildren();
  cnt.textContent=(list.length===D.length)?t('count_all',{n:num(D.length)}):t('count_some',{n:num(list.length),t:num(D.length)});
  if(active()){var c=el('button','linkbtn',t('clear'));c.type='button';c.addEventListener('click',reset);cnt.appendChild(c);}
  if(!list.length){var e=el('div','empty');e.appendChild(el('h3',null,t('empty_t')));e.appendChild(el('p',null,t('empty_b')));var b=el('button','linkbtn',t('clear'));b.type='button';b.addEventListener('click',reset);e.appendChild(b);res.appendChild(e);return;}
  CATS.forEach(function(c){
    var items=list.filter(function(d){return d.cat===c.id;});if(!items.length)return;
    var sec2=el('section','group');sec2.style.setProperty('--c','var(--c-'+c.id+')');
    var h=el('h3');var p1=el('span','pri',lang==='bn'?c.bn:c.en);p1.setAttribute('lang',lang==='bn'?'bn':'en');h.appendChild(p1);
    h.appendChild(el('span','sec',lang==='bn'?c.en:c.bn));h.appendChild(el('span','n',t(items.length===1?'group_1':'group_n',{n:num(items.length)})));sec2.appendChild(h);
    var ul=el('div','list');items.forEach(function(d){var de=dishEl(d);reveal(de);ul.appendChild(de);});sec2.appendChild(ul);res.appendChild(sec2);
  });
}
function reset(){state={q:'',cat:'all',veg:false,easy:false,saved:false,spice:'any',time:'any'};$('#q').value='';$('#veg').checked=false;$('#easy').checked=false;$('#savedonly').checked=false;$('#spice').value='any';$('#time').value='any';syncChips();render();}
function searchFor(q){reset();state.q=q;$('#q').value=q;render();$('#menu').scrollIntoView();}

/* ---------- recipe dialog ---------- */
function stepsFor(d){
  var m=M[d.method],arr=(m&&m[lang])||[],g=G[d.ing[0]],mn=g?(lang==='bn'?g[1]:g[0].toLowerCase()):'';
  return arr.map(function(s){return num(s.replace(/\{m\}/g,mn));});
}
function openDish(slug,from){
  var d=BY[slug];if(!d)return;cur=d;cooking=false;ci=0;opener=from||null;Snd.pop();
  renderRecipe();var dlg=$('#recipe');
  if(!dlg.open){if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');document.documentElement.classList.add('lock');}
  try{history.replaceState(null,'','#'+slug);}catch(e){}
  dlg.scrollTop=0;
}
function ingName(k){var g=G[k];return g?g[lang==='bn'?1:0]:k;}
function renderRecipe(){
  var d=cur;if(!d)return;var dlg=$('#recipe'),steps=stepsFor(d),cat=CATBY[d.cat];
  dlg.style.setProperty('--c','var(--c-'+d.cat+')');
  var close='<button class="dx" id="r-x" type="button" aria-label="'+esc(t('close'))+'">×</button>';
  var art='<div class="r-art">'+Art.draw(d.art,d.slug)+'</div>';
  if(cooking){
    if(ci>=steps.length){
      dlg.innerHTML=close+'<div class="cook done"><div class="big" lang="'+(lang==='bn'?'bn':'en')+'">'+esc(t('enjoy'))+'</div><p>'+esc(t('enjoy_sub',{name:pri(d)}))+'</p>'+art+'<div class="cr" style="justify-content:center"><button class="btn pri2" id="c-exit" type="button">'+esc(t('close'))+'</button><button class="btn" id="c-again" type="button">'+esc(t('how_to_cook'))+'</button></div></div>';
      $('#c-exit').onclick=function(){$('#recipe').close();};$('#c-again').onclick=function(){cooking=false;renderRecipe();};
    }else{
      var last=ci===steps.length-1;
      dlg.innerHTML=close+'<div class="cook"><div class="steam" aria-hidden="true"><span></span><span></span><span></span></div><p class="sn">'+esc(pri(d))+' · '+esc(t('step_of',{i:num(ci+1),n:num(steps.length)}))+'</p><div class="bar"><i style="width:'+Math.round((ci+1)/steps.length*100)+'%"></i></div><p class="st" lang="'+lang+'" aria-live="polite">'+esc(steps[ci])+'</p><div class="cr"><button class="btn" id="c-back" type="button"'+(ci===0?' disabled':'')+'>'+esc(t('back'))+'</button><button class="btn pri2" id="c-next" type="button">'+esc(t(last?'finish':'next'))+'</button>'+(('speechSynthesis' in window)?'<button class="btn" id="c-read" type="button">🔈 '+esc(t('read'))+'</button>':'')+'<button class="btn" id="c-exit" type="button">'+esc(t('exit'))+'</button></div></div>';
      $('#c-back').onclick=function(){if(ci>0){ci--;Snd.tick();renderRecipe();}};
      $('#c-next').onclick=function(){ci++;if(ci>=steps.length)Snd.chime();else Snd.step();renderRecipe();};
      $('#c-exit').onclick=function(){cooking=false;renderRecipe();};
      var rd=$('#c-read');if(rd)rd.onclick=function(){speak(steps[ci]);};
    }
    $('#r-x').onclick=function(){$('#recipe').close();};return;
  }
  var ing=d.ing.map(function(k,i){return '<li><label><input type="checkbox"><span>'+esc(ingName(k))+'</span></label></li>';}).join('');
  var st=steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('');
  var sp='';if(d.spice>0){sp='<li><span class="spice" role="img" aria-label="'+esc(t('spice_lbl',{n:num(d.spice)}))+'">'+[1,2,3].map(function(i){return '<span class="chili'+(i<=d.spice?' on':'')+'"></span>';}).join('')+'</span></li>';}
  dlg.innerHTML=close+'<div class="r-head">'+art+'<div><p class="r-cat">'+esc(lang==='bn'?cat.bn:cat.en)+'</p><h2 id="r-title" lang="'+(lang==='bn'?'bn':'en')+'">'+esc(pri(d))+'</h2><p class="r-en" lang="'+(lang==='bn'?'en':'bn')+'">'+esc(sec(d))+'</p><p class="r-desc">'+esc(d.desc[lang])+'</p><ul class="r-meta"><li>⏱ '+esc(num(d.min)+' '+t('min'))+'</li><li>'+esc(t('lvl'+level(d)))+'</li>'+sp+(d.veg?'<li>'+esc(t('tag_veg'))+'</li>':'')+(noteOf(d)?'<li>'+esc(noteOf(d))+'</li>':'')+'</ul><div class="r-act"><button class="btn pri2" id="r-cook" type="button">▶ '+esc(t('start_cook'))+'</button><button class="btn" id="r-save" type="button" aria-pressed="'+(isSaved(d.slug)?'true':'false')+'">♥ '+esc(t(isSaved(d.slug)?'saved':'save'))+'</button><button class="btn" id="r-share" type="button">🔗 '+esc(t('share'))+'</button></div></div></div><div class="r-body"><div><h3>'+esc(t('ingredients'))+'</h3><ul class="ing">'+ing+'</ul></div><div><h3>'+esc(t('how_to_cook'))+'</h3><ol class="steps">'+st+'</ol></div><p class="note">'+esc(t('illus_note'))+'</p></div>';
  $('#r-x').onclick=function(){$('#recipe').close();};
  $('#r-cook').onclick=function(){cooking=true;ci=0;Snd.sizzle();renderRecipe();$('#recipe').scrollTop=0;};
  $('#r-save').onclick=function(){toggleSave(d.slug);};
  $('#r-share').onclick=function(){copyText(location.href.split('#')[0]+'#'+d.slug,t('copied'));};
}
function speak(text){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang==='bn'?'bn-BD':'en-US';speechSynthesis.speak(u);}catch(e){}}
function copyText(txt,msg){
  function done(){toast(msg);Snd.tick();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}else{fallback();}
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();}
}

/* ---------- shopping list ---------- */
function renderList(){
  var dlg=$('#listdlg');var items=saved.map(function(s){return BY[s];}).filter(Boolean);
  var h='<button class="dx" id="l-x" type="button" aria-label="'+esc(t('close'))+'">×</button><div class="lst"><h2 id="l-title">'+esc(t('list_title'))+'</h2>';
  if(!items.length){h+='<p class="sub">'+esc(t('list_empty'))+'</p></div>';dlg.innerHTML=h;$('#l-x').onclick=function(){dlg.close();};return;}
  var map={};items.forEach(function(d){d.ing.forEach(function(k){(map[k]=map[k]||[]).push(d.slug);});});
  var keys=Object.keys(map).sort(function(a,b){return ingName(a).localeCompare(ingName(b),lang);});
  h+='<h3>'+esc(t('list_saved'))+'</h3><ul>'+items.map(function(d){return '<li><span>'+esc(pri(d))+'</span><button class="linkbtn" data-open="'+d.slug+'" type="button">'+esc(t('start_cook'))+'</button></li>';}).join('')+'</ul>';
  h+='<h3>'+esc(t('list_shop'))+'</h3><ul class="ing">'+keys.map(function(k){return '<li><label><input type="checkbox"><span>'+esc(ingName(k))+'</span></label><small>'+esc(t('list_in',{n:num(map[k].length)}))+'</small></li>';}).join('')+'</ul>';
  h+='<div class="btns"><button class="btn pri2" id="l-copy" type="button">'+esc(t('copy_list'))+'</button><button class="btn" id="l-clear" type="button">'+esc(t('list_clear'))+'</button></div></div>';
  dlg.innerHTML=h;
  $('#l-x').onclick=function(){dlg.close();};
  $('#l-copy').onclick=function(){copyText(items.map(function(d){return pri(d);}).join(', ')+'\n\n'+keys.map(function(k){return '- '+ingName(k);}).join('\n'),t('list_copied'));};
  $('#l-clear').onclick=function(){saved=[];store.set('saved',saved);$('#list-n').textContent=num(0);document.querySelectorAll('.fav').forEach(function(f){f.dispatchEvent(new Event('sync'));});renderList();if(state.saved)render();};
  dlg.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){dlg.close();openDish(b.dataset.open,$('#b-list'));};});
}

/* ---------- wiring ---------- */
function wire(){
  var qd;$('#q').addEventListener('input',function(){state.q=this.value;clearTimeout(qd);qd=setTimeout(render,80);});
  $('#veg').addEventListener('change',function(){Snd.tick();state.veg=this.checked;render();});
  $('#easy').addEventListener('change',function(){Snd.tick();state.easy=this.checked;render();});
  $('#savedonly').addEventListener('change',function(){Snd.tick();state.saved=this.checked;render();});
  $('#spice').addEventListener('change',function(){Snd.tick();state.spice=this.value;render();});
  $('#time').addEventListener('change',function(){Snd.tick();state.time=this.value;render();});
  $('#surprise').addEventListener('click',function(){var pool=D.filter(match);if(!pool.length)pool=D;openDish(pool[Math.floor(Math.random()*pool.length)].slug,this);});
  $('#b-lang').addEventListener('click',function(){lang=lang==='bn'?'en':'bn';store.set('lang',lang);Snd.tick();buildStatic();render();if(cur&&$('#recipe').open)renderRecipe();if($('#listdlg').open)renderList();});
  $('#b-sound').addEventListener('click',function(){Snd.set(!Snd.isOn());if(Snd.isOn())Snd.pop();buildStaticControls();});
  $('#b-mode').addEventListener('click',function(){mode=effMode()==='dark'?'light':'dark';store.set('mode',mode);Snd.tick();applyMode();});
  $('#b-list').addEventListener('click',function(){Snd.pop();renderList();var dl=$('#listdlg');if(dl.showModal)dl.showModal();else dl.setAttribute('open','');document.documentElement.classList.add('lock');});
  var rd=$('#recipe'),ld=$('#listdlg');
  [rd,ld].forEach(function(dl){
    dl.addEventListener('click',function(e){if(e.target===dl)dl.close();});
    dl.addEventListener('close',function(){
      Snd.shut();document.documentElement.classList.remove('lock');
      try{speechSynthesis.cancel();}catch(e){}
      if(dl===rd){cur=null;cooking=false;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
      if(opener&&opener.focus){try{opener.focus();}catch(e){}}
    });
  });
  rd.addEventListener('keydown',function(e){
    if(!cooking)return;
    if(e.key==='ArrowRight'){var n=$('#c-next');if(n)n.click();}
    if(e.key==='ArrowLeft'){var b=$('#c-back');if(b&&!b.disabled)b.click();}
  });
  document.querySelectorAll('.cta,.links a').forEach(function(a){a.addEventListener('click',function(){Snd.tick();});});
}
function buildStaticControls(){var sb=$('#b-sound');sb.textContent=Snd.isOn()?'🔊':'🔇';sb.setAttribute('aria-pressed',Snd.isOn()?'true':'false');sb.setAttribute('aria-label',t('ctl_sound')+': '+(Snd.isOn()?t('sound_on'):t('sound_off')));toast(Snd.isOn()?t('sound_on'):t('sound_off'));}

/* ---------- start ---------- */
if(region)document.documentElement.setAttribute('data-region',region);
wire();buildStatic();render();
var h0=(location.hash||'').slice(1);
if(h0&&BY[h0]){setTimeout(function(){openDish(h0,null);},300);}
})();

</script>
</body>
</html>
